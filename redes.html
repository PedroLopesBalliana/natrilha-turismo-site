<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redes - Natrilha Turismo</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9; /* fundo claro e limpo */
      color: #333;
    }
    header, footer {
      background-color: #2e7d32; /* verde escuro */
      padding: 15px;
      text-align: center;
      color: #fff;
    }
    .conteudo {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }
    h1 {
      font-size: 2.5em;
      color: #ff9800; /* laranja vibrante */
      margin-bottom: 30px;
    }
    .instagram {
      font-size: 2em;
      font-weight: bold;
      color: #4caf50; /* verde médio */
      background: linear-gradient(90deg, #ff9800, #4caf50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 20px 0;
      padding: 10px 20px;
      border: 2px solid #ff9800;
      border-radius: 8px;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .instagram:hover {
      border-color: #4caf50;
      transform: scale(1.1);
    }
    p {
      font-size: 1.2em;
      margin: 10px 0;
    }
    a {
      color: #4caf50; /* verde médio */
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      color: #ff5722; /* laranja intenso */
    }
  </style>
</head>
<body>
  <header>
    <img src="img/logo.png" alt="Logo Natrilha Turismo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="redes.html">Redes</a></li>
      </ul>
    </nav>
  </header>

  <div class="conteudo">
    <h1>Conecte-se Conosco</h1>
    <p>Siga nossas aventuras e novidades no Instagram:</p>
    <p><a class="instagram" href="https://instagram.com/natrilha" target="_blank">@natrilha</a></p>
    <p>📞 Telefone da empresa: <a href="tel:+5541999999999">(41) 99999-9999</a></p>
  </div>

  <footer>
    <p>&copy; 2026 Natrilha Turismo - Todos os direitos reservados</p>
  </footer>
</body>
</html>
