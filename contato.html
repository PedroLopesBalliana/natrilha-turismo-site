<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato - Natrilha Turismo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <img src="img/logo.png" alt="Logo Natrilha Turismo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <img src="img/contato-banner.png" alt="Entre em Contato Conosco!" class="titulo-img">

  <form id="form-contato" action="https://formcarry.com/s/5gqwOAjT-Br" method="POST">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem" required></textarea>

    <button type="submit" class="btn">Enviar</button>
  </form>

  <!-- Script para interceptar envio e redirecionar -->
  <script>
    const form = document.getElementById("form-contato");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = new FormData(form);
      try {
        await fetch(form.action, {
          method: "POST",
          body: data
        });
        // força o redirect sem depender da resposta do serviço
        window.location.href = "/obrigado.html";
      } catch (err) {
        alert("❌ Erro de conexão. Tente novamente.");
      }
    });
  </script>

  <footer>
    <p>&copy; 2026 Natrilha Turismo - Todos os direitos reservados</p>
  </footer>
</body>
</html>
