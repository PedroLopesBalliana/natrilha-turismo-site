<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Obrigado - Na Trilha</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('fundo-natrilha.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
    }
    .overlay {
      background-color: rgba(0,0,0,0.6);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
    }
    a {
      margin-top: 30px;
      display: inline-block;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }
    a:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <h1>Obrigado pela sua mensagem!</h1>
    <p>Recebemos seu contato e em breve retornaremos. Continue explorando e vivendo novas trilhas conosco.</p>
    <a href="index.html">Voltar para a página inicial</a>
  </div>
</body>
</html>
